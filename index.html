<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Learning Dictionary — AWS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" id="app">

    <!-- Home view -->
    <div id="homeView">
      <header class="mb-8">
        <h1 class="title">Learning Dictionaries</h1>
        <p class="subtitle">My collection of notes and concepts</p>
      </header>

      <div class="space-y-4" id="dictionaries">
        <!-- cards inserted by JS -->
      </div>
    </div>

    <!-- Dictionary view -->
    <div id="dictView" style="display:none">
      <a href="#" id="backLink" class="back" title="Back">
        <!-- ArrowLeft SVG -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to dictionaries
      </a>

      <header class="mb-8">
        <h1 class="title" id="dictTitle">AWS Dictionary</h1>
        <p class="subtitle">Amazon Web Services concepts and terminology</p>
      </header>

      <div class="mb-8">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <input id="searchInput" class="search-input" placeholder="Search by module or service..." />
        </div>
      </div>

      <main id="modulesContainer" class="space-y-8"></main>

      <p id="noMatches" class="no-results" style="display:none"></p>
    </div>

  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
